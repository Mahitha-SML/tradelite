<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      color: #202124;
      line-height: 1.5;
    }

    .invoice-header {
      width: 100%;
      border-bottom: 2px solid #1A73E8;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    .company-logo {
      max-height: 60px;
      max-width: 150px;
      vertical-align: middle;
      margin-right: 15px;
    }

    .company-name {
      font-size: 26px;
      font-weight: bold;
      color: #202124;
      margin: 0;
      vertical-align: middle;
      display: inline-block;
    }

    .invoice-title {
      color: #1A73E8;
      font-size: 36px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: right;
    }

    .header-table {
      width: 100%;
      margin-bottom: 30px;
    }

    .header-table td {
      border: none;
      padding: 0;
      vertical-align: top;
    }

    .bill-to h3 {
      color: #5F6368;
      font-size: 14px;
      text-transform: uppercase;
      margin-bottom: 8px;
      margin-top: 0;
    }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table.items-table th,
    table.items-table td {
      border: 1px solid #DADCE0;
      padding: 12px;
      text-align: left;
    }

    table.items-table th {
      background-color: #F8F9FA;
      font-weight: bold;
      color: #5F6368;
      text-transform: uppercase;
      font-size: 13px;
    }

    .right {
      text-align: right;
    }

    .summary-box {
      width: 320px;
      float: right;
      margin-top: 30px;
      border: 1px solid #DADCE0;
      padding: 20px;
      background: #F8F9FA;
      border-radius: 4px;
    }

    /* Using block elements instead of flexbox to guarantee perfect Apps Script PDF alignment */
    .summary-row {
      margin-bottom: 12px;
      width: 100%;
    }

    .summary-row .label {
      float: left;
    }

    .summary-row .val {
      float: right;
      text-align: right;
    }

    .summary-row::after {
      content: "";
      clear: both;
      display: table;
    }

    .total {
      font-weight: bold;
      font-size: 1.3em;
      border-top: 1px solid #DADCE0;
      padding-top: 15px;
      margin-top: 15px;
      color: #1A73E8;
    }

    .clear {
      clear: both;
    }
  </style>
</head>

<body>

  <!-- Top Header: Logo, Company Name, and Title -->
  <table class="invoice-header">
    <tr>
      <td style="border: none; padding: 0;">
        <img
          src="<?= logoBase64 ?>"
          class="company-logo" style="border-radius: 12px;">
        <span class="company-name">Tradelite</span>
      </td>
      <td style="border: none; padding: 0;" class="right">
        <h1 class="invoice-title">INVOICE</h1>
      </td>
    </tr>
  </table>

  <!-- Info Section: Bill To and Meta Data -->
  <table class="header-table">
    <tr>
      <td class="bill-to">
        <h3>Bill To:</h3>
        <p style="margin:0;">
          <strong>
            <?= data.customerDetails.name ?>
          </strong><br>
          <?= data.customerDetails.email ?><br>
          <?= data.customerDetails.phone || '' ?>
        </p>
      </td>
      <td class="right">
        <p style="margin: 0 0 5px 0;"><strong>Date:</strong>
          <?= data.invoiceDate ?>
        </p>
        <p style="margin: 0;"><strong>Store Location:</strong>
          <?= data.location ?>
        </p>
      </td>
    </tr>
  </table>

  <!-- Line Items Table -->
  <table class="items-table">
    <thead>
      <tr>
        <th>Product</th>
        <th>Qty</th>
        <th>Unit Price</th>
        <th>Discount</th>
        <th class="right">Line Total</th>
      </tr>
    </thead>
    <tbody>
      <? for (let i = 0; i < data.lineItems.length; i++) { ?>
      <tr>
        <td>
          <?= data.lineItems[i].productName ?>
        </td>
        <td>
          <?= data.lineItems[i].quantity ?>
        </td>
        <td>
          <?= data.lineItems[i].unitPrice.toFixed(2) ?>
        </td>
        <td>
          <?= data.lineItems[i].discountValue > 0 ? data.lineItems[i].discountValue + (data.lineItems[i].discountType === 'percent' ? '%' : ' flat') : '-' ?>
        </td>
        <td class="right">
          <?= data.lineItems[i].lineTotal.toFixed(2) ?>
        </td>
      </tr>
      <? } ?>
    </tbody>
  </table>

  <!-- Order Summary -->
  <div class="summary-box">
    <div class="summary-row">
      <span class="label">Subtotal:</span>
      <span class="val">
        <?= data.summary.subtotal.toFixed(2) ?>
      </span>
    </div>
    <div class="summary-row">
      <span class="label">Order Discount:</span>
      <span class="val">-
        <?= data.summary.orderDiscountAmount.toFixed(2) ?>
      </span>
    </div>
    <div class="summary-row">
      <span class="label">Tax (
        <?= (data.summary.taxRate * 100) ?>%):
      </span>
      <span class="val">
        <?= data.summary.taxAmount.toFixed(2) ?>
      </span>
    </div>
    <div class="summary-row total">
      <span class="label">TOTAL:</span>
      <span class="val">
        <?= data.summary.finalTotal.toFixed(2) ?>
      </span>
    </div>
  </div>

  <div class="clear"></div>

</body>

</html>
