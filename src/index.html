<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Invoice Generator</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --surface-color: #FFFFFF;
            --text-primary: #202124;
            --text-secondary: #5F6368;
            --border-color: #DADCE0;
            --primary-color: #1A73E8;
            --primary-hover: #1B66C9;
            --danger-color: #D93025;
            --danger-hover: #C5221F;
            --shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --font-family: Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            line-height: 1.5;
        }

        * {
            box-sizing: inherit;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--surface-color);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 40px;
        }

        .header-title {
            font-size: 28px;
            margin: 0 0 32px 0;
            color: var(--text-primary);
            font-weight: 500;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            padding-bottom: 8px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 24px 0 16px 0;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input, select {
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--font-family);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: var(--surface-color);
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color) inset;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background-color: #F1F3F4;
            white-space: nowrap;
        }

        td {
            background-color: var(--surface-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        td input, td select {
            width: 100%;
            padding: 8px 10px;
        }

        .col-product { width: 25%; }
        .col-qty { width: 10%; }
        .col-price { width: 15%; }
        .col-distype { width: 15%; }
        .col-disval { width: 12%; }
        .col-total { width: 15%; font-weight: 500; text-align: right; }
        .col-action { width: 8%; text-align: center; }

        .btn {
            border: none;
            background: none;
            font-family: var(--font-family);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            font-size: 15px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
        }

        .btn-secondary:hover {
            background-color: #F1F3F4;
            border-color: #D2E3FC;
        }

        .btn-danger {
            color: var(--danger-color);
            padding: 6px 12px;
        }

        .btn-danger:hover {
            background-color: #FCE8E6;
        }

        .summary-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .order-discount {
            background-color: #F8F9FA;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            min-width: 300px;
        }

        .order-discount .row-discount {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .summary-section {
            width: 100%;
            max-width: 380px;
            background-color: #F8F9FA;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .summary-row.total {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 16px;
            margin-bottom: 0;
            background-color: #E8F0FE;
            padding: 16px;
            border-radius: 4px;
        }

        .val {
            font-weight: 500;
            color: var(--text-primary);
            text-align: right;
        }

        .actions {
            margin-top: 40px;
            display: flex;
            justify-content: flex-end;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        #invoiceForm {
            width: 100%;
        }

        .product-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            background: var(--surface-color);
            box-shadow: 0 1px 3px rgba(60,64,67,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 4px 6px rgba(60,64,67,0.15);
        }

        .product-card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .product-card-id {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-card-price {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .summary-wrapper {
                flex-direction: column;
            }
            .order-discount, .summary-section {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- DASHBOARD VIEW -->
<div class="container" id="dashboard-view" style="display: block;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--primary-color); padding-bottom: 12px;">
        <h1 class="header-title" style="margin: 0; border: none; padding: 0;">Sales Employee Catalog</h1>
        <button type="button" class="btn btn-primary" onclick="showInvoiceGenerator()">+ Create Invoice</button>
    </div>
    
    <div class="products-grid" id="productsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 20px;">
        <!-- Product Cards injected via JavaScript -->
    </div>
</div>

<!-- INVOICE GENERATOR VIEW -->
<div class="container" id="invoice-view" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--primary-color); padding-bottom: 12px;">
        <h1 class="header-title" style="margin: 0; border: none; padding: 0;">Invoice Generator</h1>
        <button type="button" class="btn btn-secondary" onclick="showDashboard()">← Back to Dashboard</button>
    </div>
    
    <form id="invoiceForm">
        <!-- Header Section -->
        <div class="section-title">Invoice Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="invoiceDate">Invoice Date</label>
                <input type="date" id="invoiceDate" required>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <select id="location" required>
                    <option value="" disabled selected>Select Location</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Coimbatore">Coimbatore</option>
                    <option value="Erode">Erode</option>
                </select>
            </div>
        </div>

        <div class="section-title">Customer Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input type="text" id="customerName" placeholder="Enter Full Name" required>
            </div>
            <div class="form-group">
                <label for="customerEmail">Customer Email</label>
                <input type="email" id="customerEmail" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="customerPhone">Customer Phone</label>
                <input type="tel" id="customerPhone" placeholder="+91 9876543210" required>
            </div>
        </div>

        <!-- Line Items Section -->
        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Line Items</span>
            <button type="button" class="btn btn-secondary" onclick="addLineItem()">+ Add Item</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-product">Product</th>
                        <th class="col-qty">Quantity</th>
                        <th class="col-price">Unit Price</th>
                        <th class="col-distype">Discount Type</th>
                        <th class="col-disval">Discount Value</th>
                        <th class="col-total">Line Total</th>
                        <th class="col-action">Action</th>
                    </tr>
                </thead>
                <tbody id="lineItemsBody">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </div>

        <!-- Summary Section -->
        <div class="summary-wrapper">
            <div class="order-discount">
                <label>Order Level Discount</label>
                <div class="row-discount">
                    <select id="orderDiscountType" style="flex: 1;">
                        <option value="none">None</option>
                        <option value="percent">% (Percentage)</option>
                        <option value="amount">Fixed Amount</option>
                    </select>
                    <input type="number" id="orderDiscountValue" value="0" min="0" step="0.01" style="flex: 1;">
                </div>
            </div>

            <div class="summary-section">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span class="val" id="subtotal">0.00</span>
                </div>
                <div class="summary-row">
                    <span>Discount</span>
                    <span class="val" id="discountTotal" style="color: var(--danger-color)">- 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (18%)</span>
                    <span class="val" id="taxTotal">0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span class="val" id="finalTotal">0.00</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button type="submit" class="btn btn-primary">Generate Invoice</button>
        </div>
    </form>
</div>

<?!= include('util'); ?>
<?!= include('client'); ?>
</body>
</html>
